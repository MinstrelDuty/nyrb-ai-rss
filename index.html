<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="纽约书评、伦敦书评、泰晤士文学增刊、纽约时报书评、纽约客、大西洋月刊、洛杉矶书评与 Public Books 的 AI 中文精读归档。">
  <title>书评深度集萃</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #171717;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f8fafc;
      --accent: #18181b;
      --red: #b91c1c;
      --red-soft: #fff1f2;
      --blue: #1d4ed8;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(920px, 100%); margin: 0 auto; }
    .header {
      padding: 36px;
      background: var(--surface);
      border: 1px solid rgba(229, 231, 235, 0.8);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; letter-spacing: 0.04em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); }
    .nav-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .nav-btn, .scope-btn, .archive-btn, .download-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: #4b5563;
      font-weight: 700;
      transition: 160ms ease;
    }
    .nav-btn { padding: 9px 18px; }
    .nav-btn:hover, .scope-btn:hover, .archive-btn:hover, .download-btn:hover { border-color: #a1a1aa; }
    .nav-btn.active, .scope-btn.active, .archive-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    .reader-tools {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    .search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
    #searchInput {
      min-width: 0;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      color: var(--text);
      outline: none;
    }
    #searchInput:focus { border-color: #52525b; box-shadow: 0 0 0 3px rgba(82, 82, 91, 0.12); }
    .scope-switch {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
    }
    .scope-btn { padding: 8px 13px; border: 0; border-radius: 8px; }
    .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
    #resultCount { margin-right: auto; color: var(--muted); font-size: 14px; }
    .archive-btn, .download-btn { padding: 8px 14px; }
    button:disabled { cursor: wait; opacity: 0.58; }
    .notice {
      margin: 18px 0 0;
      padding: 12px 16px;
      border: 1px solid #fde68a;
      border-radius: 12px;
      background: #fffbeb;
      color: #92400e;
      font-size: 14px;
    }
    .loading, .empty-state {
      margin-top: 24px;
      padding: 48px 24px;
      border-radius: 16px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
      box-shadow: 0 3px 16px rgba(15, 23, 42, 0.04);
    }
    .empty-state.error { color: var(--red); }
    .issue-group, .search-results { margin-top: 34px; }
    .issue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #d4d4d8;
    }
    .issue-title, .search-heading { margin: 0; font-size: 21px; }
    .search-heading { margin-bottom: 16px; font-weight: 800; }
    .article-card {
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: 0 3px 14px rgba(15, 23, 42, 0.04);
    }
    .article-header {
      display: flex;
      width: 100%;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 23px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .article-header:hover { background: #fdfdfd; }
    .article-title-wrap { display: block; min-width: 0; flex: 1; }
    .source-badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 800;
    }
    .article-title-en {
      display: block;
      color: #71717a;
      font-family: Georgia, serif;
      font-size: 15px;
      font-style: italic;
      line-height: 1.5;
    }
    .article-title-zh { display: block; margin: 5px 0 12px; font-size: 22px; font-weight: 850; line-height: 1.35; }
    .article-meta-author {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 7px;
      background: #f1f5f9;
      color: #475569;
      font-size: 13px;
    }
    .article-hook {
      display: block;
      margin-bottom: 12px;
      padding: 9px 13px;
      border-left: 4px solid var(--red);
      border-radius: 6px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 14px;
      font-weight: 650;
    }
    .article-meta { display: flex; flex-wrap: wrap; gap: 14px; color: #9ca3af; font-size: 13px; }
    .original-link { color: var(--blue); text-decoration: none; }
    .search-snippet { margin: 0 0 12px; color: #52525b; font-size: 14px; }
    mark { padding: 0 2px; border-radius: 3px; background: #fef08a; color: inherit; }
    .toggle-icon { flex: 0 0 auto; color: #a1a1aa; font-size: 24px; transition: transform 180ms ease; }
    .article-body { display: none; padding: 0 24px 28px; border-top: 1px dashed var(--line); }
    .article-card.open .article-body { display: block; }
    .article-card.open .toggle-icon { transform: rotate(180deg); }
    .article-content { padding-top: 22px; color: #303036; font-size: 16px; }
    .article-content h3 { margin: 28px 0 14px; padding-left: 11px; border-left: 4px solid var(--accent); color: #18181b; }
    .article-content img { max-width: 100%; height: auto; border-radius: 10px; }
    .article-content a { color: var(--blue); }
    .article-content blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid #d4d4d8; color: #52525b; }
    .article-content pre { overflow-x: auto; white-space: pre-wrap; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .header { padding: 24px 18px; border-radius: 16px; }
      .search-row { grid-template-columns: 1fr; }
      .scope-switch { width: 100%; }
      .scope-btn { flex: 1; }
      .tool-row { align-items: stretch; }
      #resultCount { width: 100%; margin: 0; }
      .archive-btn { flex: 1 1 100%; }
      .issue-header { align-items: flex-start; flex-direction: column; }
      .download-btn { width: 100%; }
      .article-header { padding: 19px 17px; }
      .article-body { padding: 0 17px 22px; }
      .article-title-zh { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">AI Review Archive</p>
      <h1>📚 书评深度集萃</h1>
      <p class="subtitle">八种书评刊物的中文精读、全文检索与 Obsidian 归档。</p>

      <nav class="nav-tabs" aria-label="刊物选择">
        <button class="nav-btn active" type="button" data-source="nyrb">纽约书评</button>
        <button class="nav-btn" type="button" data-source="lrb">伦敦书评</button>
        <button class="nav-btn" type="button" data-source="tls">泰晤士文学增刊</button>
        <button class="nav-btn" type="button" data-source="nyt">纽时书评</button>
        <button class="nav-btn" type="button" data-source="newyorker">纽约客</button>
        <button class="nav-btn" type="button" data-source="atlantic">大西洋月刊</button>
        <button class="nav-btn" type="button" data-source="larb">洛杉矶书评</button>
        <button class="nav-btn" type="button" data-source="publicbooks">Public Books</button>
      </nav>

      <section class="reader-tools" aria-label="检索与归档">
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="检索标题、作者、破题与全文…" autocomplete="off">
          <div class="scope-switch" role="group" aria-label="检索范围">
            <button class="scope-btn active" type="button" data-scope="current">当前刊物</button>
            <button class="scope-btn" type="button" data-scope="all">全部八刊</button>
          </div>
        </div>
        <div class="tool-row">
          <span id="resultCount" aria-live="polite"></span>
          <button id="downloadCurrentArchive" class="archive-btn" type="button">下载当前刊物归档</button>
          <button id="downloadAllArchive" class="archive-btn primary" type="button">下载全部八刊归档</button>
        </div>
      </section>
      <div id="notice" class="notice" hidden></div>
    </header>

    <div id="content" class="loading">正在加载书评档案…</div>
  </main>

  <script src="web-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
