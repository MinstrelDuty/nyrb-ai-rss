name: Test source expansion collectors

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source-expansion branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run verified collectors
        run: |
          python newyorker_rss.py
          python atlantic_books.py
          if [ -f publicbooks_rss.py ]; then python publicbooks_rss.py; fi
      - name: Run tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall .
