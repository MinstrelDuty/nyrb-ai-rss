name: 📚 三大刊 raw 正文归档

on:
  schedule:
    - cron: '0 8 * * 1,4' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect raw article text
        run: |
          python "nyrb_rss.py"
          python "lrb_rss.py"
          python "tls_rss.py"

      - name: Commit and push raw articles
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add raw/
          if git diff --cached --quiet; then
            echo "No new raw articles"
          else
            git commit -m "Update raw article archive"
            git push
          fi
