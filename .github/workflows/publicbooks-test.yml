name: Test Public Books Reviews collector

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe Public Books Reviews collector
        run: python publicbooks_rss.py
      - name: Run tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall .
